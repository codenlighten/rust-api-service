[package]
name = "rust-api-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "Notes REST API: axum, sqlx/SQLite, argon2, signed bearer tokens, problem+json"
default-run = "rust-api-service"

[lib]
name = "notes_api"
path = "src/lib.rs"

[[bin]]
name = "rust-api-service"
path = "src/main.rs"

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
